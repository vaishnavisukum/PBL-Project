<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup - Alankaar Jewellers</title>

    <!-- Matching Jewellery Site Style -->
    <style>
      body {
        background-color: #ffe6f2;
        color: #4a0033;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      /* Navbar */
      .navbar {
        background: #ffb6c1;
        padding: 12px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 3px 10px rgba(255, 105, 180, 0.4);
      }
      .logo {
        margin: auto;
        font-size: 22px;
        font-weight: 700;
        color: #4a0033;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .nav-icons a {
        font-size: 26px;
        text-decoration: none;
      }

      /* Form Wrapper */
      .form-wrapper {
        background: white;
        width: 90%;
        max-width: 380px;
        margin: 50px auto;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 4px 15px rgba(255, 105, 180, 0.3);
        animation: fadeIn 0.6s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h2 {
        margin-bottom: 25px;
        color: #4a0033;
      }

      /* Input Fields */
      .form-group {
        text-align: left;
        margin-bottom: 15px;
      }

      .form-group label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }

      .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid pink;
        font-size: 15px;
      }

      /* Buttons */
      .btn-primary {
        background: #ff69b4;
        color: white;
        border: none;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
        box-shadow: 0 3px 10px rgba(255, 105, 180, 0.4);
      }

      .btn-outline {
        background: white;
        color: #ff1493;
        border: 2px solid #ff69b4;
        padding: 12px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 10px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }

      .btn-primary:hover {
        background: #ff3d96;
      }
      .btn-outline:hover {
        background: #ffe6f2;
      }

      @media (max-width: 600px) {
        .form-wrapper {
          margin-top: 30px;
          padding: 25px;
        }
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <div class="logo">Alankaar Jewellers</div>
     
    </header>

   <div class="form-wrapper">
      <h2>Login / Signup</h2>

      <form id="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input id="email" type="email" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input id="password" type="password" required />
        </div>

        <button class="btn-primary" type="submit">Login</button>
        <button class="btn-outline" type="button" id="signup-btn">
          Create Account
        </button>
      </form>
    </div>

    <script type="module" src="auth.js"></script>
  </body>
</html>
