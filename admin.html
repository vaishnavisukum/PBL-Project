<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Panel – Alankar Jewellers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf5ee;
        --card: #ffffff;
        --gold: #c49a3a;
        --gold-soft: #f4e1a6;
        --text-main: #3b2b12;
        --danger: #c2373f;
      }
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(
          circle at top,
          #fff8e8 0,
          #f3e6cf 40%,
          #f0ebe4 100%
        );
        color: var(--text-main);
      }

      header {
        background: linear-gradient(90deg, #1f1306, #3c2a11);
        color: #f9f3e4;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-logo {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 2px solid var(--gold);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
        background: radial-gradient(circle, #fbe9b5, #b78a2c);
      }
      .brand-title {
        font-size: 17px;
        font-weight: 600;
      }

      .admin-meta {
        font-size: 12px;
        opacity: 0.8;
        text-align: right;
      }
      .admin-meta a {
        color: #f4e1a6;
        text-decoration: none;
      }

      main {
        max-width: 1000px;
        margin: 16px auto 32px;
        padding: 0 14px;
      }

      h2 {
        margin: 10px 0;
        font-size: 20px;
      }
      .sub {
        font-size: 13px;
        opacity: 0.8;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.5fr);
        gap: 18px;
        margin-top: 12px;
      }

      .card {
        background: rgba(255, 255, 255, 0.97);
        border-radius: 16px;
        padding: 14px 14px 12px;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(196, 154, 58, 0.28);
      }

      label {
        font-size: 13px;
        display: block;
        margin-bottom: 4px;
      }
      .input,
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid #e1d4c2;
        background: #fbf7f1;
        font-size: 13px;
        outline: none;
        margin-bottom: 10px;
      }
      .input:focus,
      select:focus {
        border-color: var(--gold);
        background: #fffaf0;
      }

      .file-input {
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px dashed #d4c4a7;
        background: #fffdf7;
        font-size: 12px;
        margin-bottom: 8px;
        width: 100%;
      }

      .preview-box {
        width: 100%;
        max-width: 220px;
        aspect-ratio: 4/3;
        border-radius: 14px;
        border: 1px dashed #d4c4a7;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fffaf0;
        margin-top: 6px;
      }
      .preview-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .preview-placeholder {
        font-size: 12px;
        opacity: 0.7;
        padding: 8px;
        text-align: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        gap: 6px;
      }
      .btn-primary {
        background: linear-gradient(135deg, #c99b3b, #f1d291);
        color: #2a1d09;
        box-shadow: 0 10px 24px rgba(201, 155, 59, 0.35);
      }
      .btn-primary:hover {
        box-shadow: 0 12px 30px rgba(201, 155, 59, 0.45);
      }
      .btn-secondary {
        background: #fffdf7;
        border: 1px solid #e1d4c2;
      }
      .btn-danger {
        background: #fce2e4;
        color: #8d1f26;
        border: 1px solid #e6a4aa;
        font-size: 12px;
        padding: 5px 10px;
      }

      .status-text {
        font-size: 12px;
        min-height: 16px;
        margin-top: 4px;
      }
      .status-text.ok {
        color: #2f7a3e;
      }
      .status-text.err {
        color: var(--danger);
      }

      .product-list {
        max-height: 480px;
        overflow: auto;
        margin-top: 4px;
      }

      .prod-row {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) auto;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #e8ddcc;
        align-items: center;
        font-size: 13px;
      }
      .prod-thumb {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: cover;
        background: #f5ecdd;
      }
      .prod-name {
        font-weight: 500;
      }
      .prod-meta {
        font-size: 11px;
        opacity: 0.75;
      }

      @media (max-width: 780px) {
        .grid {
          grid-template-columns: minmax(0, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-logo">💍</div>
        <div class="brand-title">Alankar Admin</div>
      </div>
      <div class="admin-meta">
        <div>Manage catalogue (products collection)</div>
        <div><a href="index.html">← Back to site</a></div>
      </div>
    </header>

    <main>
      <h2>Product Catalogue</h2>
      <div class="sub">
        Add new jewellery items, upload images, and manage existing products
        stored in Firestore.
      </div>

      <div class="grid">
        <!-- LEFT: FORM -->
        <div class="card">
          <h3 style="margin: 0 0 8px; font-size: 15px">Add / Upload Product</h3>
          <form id="product-form">
            <label for="p-name">Name</label>
            <input
              id="p-name"
              class="input"
              placeholder="e.g. Thushi Necklace"
            />

            <label for="p-price">Price (₹)</label>
            <input
              id="p-price"
              class="input"
              type="number"
              min="0"
              step="1"
              placeholder="e.g. 5999"
            />

            <label for="p-category">Category</label>
            <select id="p-category">
              <option value="">Select category</option>
              <option value="maharashtrian">Maharashtrian</option>
              <option value="gujarati">Gujarati</option>
              <option value="rajasthani">Rajasthani</option>
              <option value="peshwai">Peshwai</option>
              <option value="south">South Indian</option>
            </select>

            <label for="p-image">Product image</label>
            <input
              id="p-image"
              type="file"
              accept="image/*"
              class="file-input"
            />
            <div class="preview-box" id="preview-box">
              <div class="preview-placeholder">
                Image preview will appear here.
              </div>
            </div>

            <div class="status-text" id="form-status"></div>

            <div
              style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px"
            >
              <button type="submit" class="btn btn-primary">
                Save product
              </button>
              <button type="button" class="btn btn-secondary" id="btn-reset">
                Reset
              </button>
            </div>
          </form>
        </div>

        <!-- RIGHT: EXISTING PRODUCTS -->
        <div class="card">
          <h3 style="margin: 0 0 8px; font-size: 15px">Existing Products</h3>
          <div class="sub" id="list-sub">Loading products…</div>
          <div class="product-list" id="product-list"></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { db, storage } from "./firebase.js";
      import {
        collection,
        addDoc,
        getDocs,
        deleteDoc,
        doc,
        orderBy,
        query,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
      import {
        ref,
        uploadBytes,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

      const form = document.getElementById("product-form");
      const nameInput = document.getElementById("p-name");
      const priceInput = document.getElementById("p-price");
      const categorySelect = document.getElementById("p-category");
      const fileInput = document.getElementById("p-image");
      const previewBox = document.getElementById("preview-box");
      const formStatus = document.getElementById("form-status");
      const listSub = document.getElementById("list-sub");
      const productList = document.getElementById("product-list");

      let currentFile = null;

      // preview
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        currentFile = file || null;
        if (!file) {
          previewBox.innerHTML =
            '<div class="preview-placeholder">Image preview will appear here.</div>';
          return;
        }
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        previewBox.innerHTML = "";
        previewBox.appendChild(img);
      });

      // reset
      document.getElementById("btn-reset").addEventListener("click", () => {
        form.reset();
        currentFile = null;
        previewBox.innerHTML =
          '<div class="preview-placeholder">Image preview will appear here.</div>';
        formStatus.textContent = "";
        formStatus.className = "status-text";
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        formStatus.textContent = "";
        formStatus.className = "status-text";

        const name = nameInput.value.trim();
        const price = Number(priceInput.value);
        const category = categorySelect.value;
        const file = currentFile;

        if (!name || !price || !category || !file) {
          formStatus.textContent = "Fill all fields and pick an image.";
          formStatus.classList.add("err");
          return;
        }

        try {
          formStatus.textContent = "Uploading image…";
          // upload to Storage
          const path = "product_images/" + Date.now() + "_" + file.name;
          const storageRef = ref(storage, path);
          await uploadBytes(storageRef, file);
          const imageURL = await getDownloadURL(storageRef);

          formStatus.textContent = "Saving product in Firestore…";

          await addDoc(collection(db, "products"), {
            name,
            price,
            category,
            img: imageURL,
            createdAt: new Date().toISOString(),
          });

          formStatus.textContent = "Product saved.";
          formStatus.classList.add("ok");

          form.reset();
          currentFile = null;
          previewBox.innerHTML =
            '<div class="preview-placeholder">Image preview will appear here.</div>';

          await loadProducts();
        } catch (err) {
          console.error(err);
          formStatus.textContent = "Error: " + err.message;
          formStatus.classList.add("err");
        }
      });

      async function loadProducts() {
        listSub.textContent = "Loading products…";
        productList.innerHTML = "";
        try {
          const q = query(
            collection(db, "products"),
            orderBy("createdAt", "desc")
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            listSub.textContent = "No products found in 'products' collection.";
            return;
          }
          listSub.textContent = "Showing latest " + snap.size + " products.";
          snap.forEach((d) => {
            const data = d.data();
            const row = document.createElement("div");
            row.className = "prod-row";
            row.innerHTML = `
          <img class="prod-thumb" src="${data.img || ""}" alt="${
              data.name || ""
            }">
          <div>
            <div class="prod-name">${escapeHtml(data.name || "Untitled")}</div>
            <div class="prod-meta">
              ₹${Number(data.price || 0)} • ${escapeHtml(
              data.category || "other"
            )}
            </div>
          </div>
          <button class="btn-danger" data-id="${d.id}">Delete</button>
        `;
            productList.appendChild(row);
          });
        } catch (err) {
          console.error(err);
          listSub.textContent = "Failed to load products: " + err.message;
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      productList.addEventListener("click", async (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        if (!id) return;
        if (!confirm("Delete this product?")) return;

        try {
          await deleteDoc(doc(db, "products", id));
          await loadProducts();
        } catch (err) {
          alert("Failed to delete: " + err.message);
        }
      });

      document.addEventListener("DOMContentLoaded", () => {
        loadProducts();
      });
    </script>
  </body>
</html>
